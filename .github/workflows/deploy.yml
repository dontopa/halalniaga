name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare token
        id: token
        run: |
          if [ -n "${{ secrets.ADMIN_CI_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Cloudflare token
        if: steps.token.outputs.available == 'true'
        env:
          ADMIN_CI_TOKEN: ${{ secrets.ADMIN_CI_TOKEN }}
        run: node scripts/refresh-cloudflare-token.mjs

      - name: Build and deploy to Cloudflare Pages
        if: steps.token.outputs.available == 'true'
        run: npm run deploy

      - name: Deployment skipped
        if: steps.token.outputs.available != 'true'
        run: |
          echo "ADMIN_CI_TOKEN is not set."
          echo "Add it in GitHub → Settings → Secrets and variables → Actions."
